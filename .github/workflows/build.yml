name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Empacotar
        shell: pwsh
        run: |
          [xml]$x = Get-Content src/ZeroDash/ZeroDash.csproj
          $ver = @($x.Project.PropertyGroup.Version)[0]
          Compress-Archive -Path "dist/ZeroDash/*" -DestinationPath "ZeroDash-v$ver.zip"
          "ASSET=ZeroDash-v$ver.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
