<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="skin-name" content="Dourado [clássico]"><title>ZeroDash</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#f2b632;--tx:#f6f3ea;--mu:#8d8873;--ln:#2c2412}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:var(--tx);cursor:none}
#st{position:absolute;left:0;top:0;width:1920px;height:480px;transform-origin:0 0;display:grid;grid-template-rows:104px 190px 134px;gap:12px;padding:14px;background:#050505}
.row{display:grid;gap:12px;min-height:0}
.p{background:linear-gradient(180deg,#100f0b,#090908);border:1px solid var(--ln);border-radius:12px;padding:12px 18px;overflow:hidden;position:relative;min-width:0}
.ib{width:56px;height:56px;border-radius:50%;border:1.5px solid #8a6414;background:radial-gradient(circle at 50% 35%,#2e220a,#0c0b08);color:var(--g);display:grid;place-items:center;flex:none}
.ib svg{width:28px;height:28px}
.k{display:flex;align-items:center;gap:14px;padding:10px 16px}
.l{font-size:18px;color:var(--mu)}.v{font-size:44px;font-weight:600;line-height:1;white-space:nowrap}
.v small{font-size:22px;color:var(--mu);font-weight:500;margin-left:5px}.s{font-size:18px;color:var(--g);margin-top:3px;white-space:nowrap}
.h{display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--mu);height:28px}
.h b{font-size:34px;font-weight:600;color:var(--tx)}.h i{font-style:normal;color:var(--g);font-weight:600;font-size:22px;margin-left:6px}
canvas{display:block}
.bar{height:5px;background:#1b1810;border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a4e08,#e9a825,#ffd770);transform-origin:0 0;transform:scaleX(0);transition:transform .45s}
.dn{display:flex;gap:16px;align-items:center;height:136px}.dn .c{position:relative;width:124px;height:124px;flex:none}
.dn svg{width:124px;height:124px;transform:rotate(-90deg)}.dn circle{fill:none;stroke-width:12;stroke-linecap:round}
#dn{stroke:url(#gg);stroke-dasharray:314.16;stroke-dashoffset:314.16;transition:stroke-dashoffset .5s}
.dn .c span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:600;line-height:1}.dn .c small{font-size:14px;color:var(--mu);font-weight:500;margin-top:3px}
.lg{flex:1;font-size:18px;color:var(--mu)}.lg b{display:block;font-size:28px;color:var(--tx);font-weight:600;line-height:1.1;margin-bottom:8px}
.fr{display:grid;grid-template-columns:28px 1fr auto;column-gap:10px;align-items:center;margin-top:7px;font-size:18px}
.fr b{font-size:24px;font-weight:600}.fr em{font-style:normal;color:var(--g);font-size:18px;margin-left:6px}.fr .bar{grid-column:1/4;margin-top:2px}
.fr svg{width:28px;height:28px}.fr g{fill:var(--g);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.big{font-size:36px;font-weight:600;line-height:1.1}.mid{display:flex;align-items:center;gap:16px;height:100%}.mid>div:last-child{flex:1;min-width:0}
#clk{font-size:76px;font-weight:600;letter-spacing:-2px;line-height:1}#dt{font-size:26px;color:var(--g);margin-top:2px}
.ct{text-align:center;display:flex;flex-direction:column;justify-content:center;height:100%}
.bd{display:flex;align-items:center;gap:16px;height:100%}.bd .st{margin-left:auto;display:flex;gap:34px}.bd .st b{display:block;font-size:40px;font-weight:600;line-height:1}.bd .st span{font-size:18px;color:var(--mu)}
#off{position:absolute;right:8px;top:6px;width:10px;height:10px;border-radius:5px;background:#f87171;display:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a0a"/><stop offset="1" stop-color="#ffd770"/></linearGradient></defs></svg>
<div id="st">
 <div class="row" id="r1" style="grid-template-columns:repeat(6,1fr)"></div>
 <div class="row" style="grid-template-columns:560px 520px 360px 1fr">
  <section class="p"><div class="h"><span>Histórico de FPS (60 s)</span><b id="fv">0</b></div><canvas id="c1" width="522" height="118"></canvas></section>
  <section class="p"><div class="h"><span>Carga CPU / GPU</span><span>CPU<i id="lc">0%</i> GPU<i id="lg" style="color:#f6f3ea">0%</i></span></div><canvas id="c2" width="482" height="118"></canvas></section>
  <section class="p"><div class="h"><span>Memória DDR5-5600</span></div><div class="dn"><div class="c"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="#1b1810"/><circle id="dn" cx="60" cy="60" r="50"/></svg><span id="dp">--<small>em uso</small></span></div>
   <div class="lg">Utilizada<b id="mu">--</b>Virtual<b id="mv">--</b></div></div></section>
  <section class="p"><div class="h"><span>Ventoinhas</span></div><div id="fans"></div></section>
 </div>
 <div class="row" style="grid-template-columns:1.1fr 1fr 1.2fr">
  <section class="p"><div class="mid" id="dk"></div></section>
  <section class="p ct"><div id="clk">--:--</div><div id="dt"></div></section>
  <section class="p"><div class="bd" id="bd"></div></section>
 </div>
</div><div id="off"></div>
<script>
const $=id=>document.getElementById(id),MOCK=/mock/.test(location.search),n0=(v,d=0)=>v==null?'--':(+v).toFixed(d);
const IC={therm:'M10 14.5V5a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z',gauge:'M4 17a8 8 0 1 1 16 0M12 17l4-5',bolt:'M13 3L5 14h6l-1 7 8-11h-6z',chip:'M7 7h10v10H7zM9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4',disk:'M4 7c0-2 16-2 16 0v10c0 2-16 2-16 0zM4 12c0 2 16 2 16 0',board:'M4 4h16v16H4zM8 8h8v8H8z'};
const ic=k=>`<div class=ib><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg></div>`;
$('r1').innerHTML=[['k1','therm','Temperatura CPU'],['k2','gauge','Boost clock CPU'],['k3','bolt','FPS'],['k4','therm','Temperatura GPU'],['k5','gauge','Boost clock GPU'],['k6','chip','Memória']].map(([i,c,l])=>`<section class="p k">${ic(c)}<div><div class=l>${l}</div><div class=v id=${i}>--</div><div class=s id=${i}s>--</div></div></section>`).join('');
const bl='<svg viewBox="-20 -20 40 40"><g>'+[0,120,240].map(a=>`<path transform="rotate(${a})" d="M0 0C7-3 11-13 3-18C-4-11-4-4 0 0Z"/>`).join('')+'</g></svg>';
$('fans').innerHTML=[['f1','WC 360 mm'],['f2','Gabinete'],['f3','RTX 5070 Ti']].map(([k,n])=>`<div class=fr>${bl}<span>${n}</span><span><b id=${k}>--</b><em id=${k}p></em></span><div class=bar><i id=${k}i></i></div></div>`).join('');
$('bd').innerHTML=ic('board')+'<div><div class=big>MSI MAG B850</div><div class=l>Tomahawk Max WiFi</div></div><div class=st><div><b id=bios>--</b><span>BIOS</span></div><div><b id=vrm>--</b><span>VRM</span></div></div>';
const H={fps:Array(120).fill(0),cpu:Array(120).fill(0),gpu:Array(120).fill(0)},push=(a,v)=>{a.push(v);a.shift()};
function area(cv,ser,max,cols){const c=cv.getContext('2d'),w=cv.width,h=cv.height,x0=36;c.clearRect(0,0,w,h);c.font='14px Segoe UI';c.lineWidth=1;
 for(let i=0;i<=3;i++){const y=4+i*(h-8)/3;c.strokeStyle='#1e1a0e';c.beginPath();c.moveTo(x0,y);c.lineTo(w,y);c.stroke();c.fillStyle='#6d6652';c.fillText(Math.round(max*(1-i/3)),0,y+5)}
 ser.forEach((s,k)=>{c.beginPath();s.forEach((v,i)=>{const x=x0+i*(w-x0)/(s.length-1),y=h-4-Math.min(1,v/max)*(h-8);i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle=cols[k];c.lineWidth=2.5;c.stroke();
  if(!k){c.lineTo(w,h-4);c.lineTo(x0,h-4);const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#f2b63266');g.addColorStop(1,'#f2b63200');c.fillStyle=g;c.fill()}})}
const kv=(i,v,u,s)=>{$(i).innerHTML=v+'<small>'+u+'</small>';$(i+'s').textContent=s};
function render(r){const d=r.data;if(!d)return;const f=r.fps||0,c=d.cpu,g=d.gpu;
 kv('k1',n0(c.temp),'°C','Utilização '+n0(c.load)+'%');kv('k2',n0(c.clock),'MHz',n0(c.volt,3)+' V');
 kv('k3',Math.round(f),'FPS',f>0?'Frame time '+(1000/f).toFixed(1)+' ms':'Aguardando jogo');
 kv('k4',n0(g.temp),'°C','Utilização '+n0(g.load)+'%');kv('k5',n0(g.clock),'MHz',n0(g.volt,3)+' V');kv('k6',n0(d.ram.pct),'%',n0(d.ram.usedMB)+' MB');
 push(H.fps,f);push(H.cpu,c.load||0);push(H.gpu,g.load||0);$('fv').textContent=Math.round(f);$('lc').textContent=n0(c.load)+'%';$('lg').textContent=n0(g.load)+'%';
 area($('c1'),[H.fps],Math.ceil(Math.max(60,...H.fps)/30)*30,['#f2b632']);area($('c2'),[H.cpu,H.gpu],100,['#f2b632','#f6f3ea']);
 $('dn').style.strokeDashoffset=314.16*(1-Math.min(1,d.ram.pct/100));$('dp').innerHTML=n0(d.ram.pct)+'%<small>em uso</small>';$('mu').textContent=n0(d.ram.usedMB)+' MB';$('mv').textContent=n0(d.virt.pct)+'%';
 [['f1',d.fans.pump],['f2',d.fans.case],['f3',d.fans.gpu]].forEach(([k,x])=>{$(k).textContent=n0(x.rpm)+' RPM';$(k+'p').textContent=n0(x.pct)+'%';$(k+'i').style.transform='scaleX('+Math.min(1,(x.pct||0)/100)+')';
  const e=$(k).closest('.fr').querySelector('g');e.style.animationDuration=x.rpm>0?Math.max(.08,Math.min(3,300/x.rpm))+'s':'0s';e.style.animationPlayState=x.rpm>0?'running':'paused'});
 const k=d.disks.find(x=>x.name[0]==='C');if(k)$('dk').innerHTML=ic('disk')+`<div><div class=l>${k.label} · ${k.name}</div><div class=big>Livre ${n0(k.freeGB)} GB</div><div class=bar><i style="transform:scaleX(${k.totalGB?1-k.freeGB/k.totalGB:0})"></i></div></div>`;
 $('bios').textContent=d.bios||'--';$('vrm').textContent=n0(d.vrm)+'°C'}
let mk={fps:140};
function mock(){const j=(v,a,lo,hi)=>Math.max(lo,Math.min(hi,v+(Math.random()-.5)*a));mk.c=j(mk.c||47,6,35,85);mk.g=j(mk.g||60,8,0,100);mk.fps=j(mk.fps,20,60,240);
 return{fps:mk.fps,data:{cpu:{load:mk.g/3,temp:mk.c,clock:4850,volt:1.0},gpu:{load:mk.g,temp:40+mk.g/3,clock:2737,volt:1.04},ram:{pct:75,usedMB:23989},virt:{pct:93},
 fans:{pump:{rpm:4615,pct:84},case:{rpm:1775,pct:94},gpu:{rpm:mk.g>20?1800:0,pct:mk.g>20?50:0}},disks:[{name:'C:\\',label:'XPG SX8200 PRO NVME',freeGB:565,totalGB:2048}],bios:'2.A48',vrm:43.5}}}
async function tick(){try{const r=MOCK?mock():await(await fetch('/api/metrics')).json();render(r);$('off').style.display='none'}catch(e){$('off').style.display='block'}}
function fit(){$('st').style.transform='scale('+Math.min(innerWidth/1920,innerHeight/480)+')'}
function clock(){const n=new Date();$('clk').textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('dt').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
addEventListener('resize',fit);addEventListener('dblclick',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
fit();clock();tick();setInterval(tick,500);setInterval(clock,10000);
</script></body></html>
